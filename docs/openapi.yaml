openapi: 3.0.3

info:
  title: MotoFlow API
  description: API para gerenciamento de oficinas de motocicletas.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: Ambiente local

tags:
  - name: Health
    description: Verificação de disponibilidade da API

  - name: Autenticação
    description: Endpoints relacionados à autenticação dos usuários

paths:

  /health:
    get:
      tags:
        - Health
      summary: Verifica a disponibilidade da API
      description: Retorna o estado atual da API.
      operationId: healthCheck

      responses:
        '200':
          description: API disponível

  /login:
    post:
      tags:
        - Autenticação
      summary: Realiza o login do usuário
      description: Inicia o processo de autenticação do usuário.
      operationId: login

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: E-mail utilizado para autenticação
                  example: usuario@motoflow.com

                password:
                  type: string
                  format: password
                  description: Senha do usuário
                  example: secret

      responses:
        '200':
          description: Login iniciado com sucesso

        '401':
          description: Credenciais inválidas

        '422':
          description: Dados de entrada inválidos

  /login/verify:
    post:
      tags:
        - Autenticação
      summary: Verifica o código de autenticação
      description: >
        Valida o código de autenticação de dois fatores enviado ao usuário
        após o login. Quando o código é válido, utilizado pela primeira vez
        e ainda está dentro do prazo de validade, a autenticação é concluída
        e um token de acesso Sanctum é gerado.
      operationId: verifyLogin

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                  description: E-mail utilizado na tentativa de login
                  example: usuario@motoflow.com

                code:
                  type: string
                  description: Código de autenticação de dois fatores recebido pelo usuário
                  example: "123456"

      responses:
        '200':
          description: Código validado e autenticação concluída
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: USER.LOGIN.SUCCESS

                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: Token de acesso gerado pelo Laravel Sanctum
                        example: 1|abcdefghijklmnopqrstuvwxyz123456

                      token_type:
                        type: string
                        example: Bearer

        '401':
          description: Código inválido ou credenciais inválidas

        '422':
          description: Dados de entrada inválidos

        '403':
          description: Código expirado ou número máximo de tentativas excedido

  /logout:
    post:
      tags:
        - Autenticação
      summary: Encerra a sessão atual
      description: >
        Revoga o token de acesso Sanctum utilizado na requisição,
        encerrando somente a sessão atual do usuário.
      operationId: logout

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Sessão encerrada com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: USER.LOGOUT.DONE

                  data:
                    nullable: true
                    example: null

        '401':
          description: Token de acesso ausente, inválido ou expirado

  /logout-all:
    post:
      tags:
        - Autenticação
      summary: Encerra todas as sessões do usuário
      description: >
        Revoga todos os tokens de acesso Sanctum associados ao usuário,
        encerrando todas as sessões ativas em todos os dispositivos.
      operationId: logoutAll

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Todas as sessões foram encerradas com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: USER.LOGOUT.ALL.DONE

                  data:
                    nullable: true
                    example: null

        '401':
          description: Token de acesso ausente, inválido ou expirado

  /clients:
    post:
      tags:
        - Clientes
      summary: Cadastra um novo cliente
      description: >
        Cadastra um novo cliente vinculado ao usuário autenticado.
        O telefone e o documento são normalizados antes de serem armazenados.

      operationId: createClient

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - phone
              properties:
                name:
                  type: string
                  maxLength: 255
                  description: Nome completo do cliente
                  example: João da Silva

                phone:
                  type: string
                  description: >
                    Número de celular brasileiro. Pode ser informado
                    com máscara ou apenas números.
                  example: "(19) 98765-4321"

                email:
                  type: string
                  format: email
                  nullable: true
                  maxLength: 255
                  description: E-mail do cliente
                  example: joao@email.com

                document:
                  type: string
                  nullable: true
                  maxLength: 20
                  description: Documento do cliente, como CPF ou CNPJ
                  example: "123.456.789-00"

                address:
                  type: string
                  nullable: true
                  description: Endereço do cliente
                  example: Rua das Flores, 100

            example:
              name: João da Silva
              phone: "(19) 98765-4321"
              email: joao@email.com
              document: "123.456.789-00"
              address: Rua das Flores, 100

      responses:
        '201':
          description: Cliente cadastrado com sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: CLIENT.CREATE.SUCCESS

                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: Identificador do cliente
                        example: 1

                      avatar_path:
                        type: string
                        nullable: true
                        description: Caminho da foto do cliente
                        example: null

        '401':
          description: Usuário não autenticado

        '422':
          description: Dados de entrada inválidos

  /api/motorcycle/{clientId}:
    post:
      tags:
        - Motocicletas
      summary: Cadastrar motocicleta para um cliente
      description: |
        Cadastra uma nova motocicleta vinculada a um cliente.

        O cliente informado no parâmetro `clientId` deve existir e
        pertencer ao usuário autenticado.

        A placa e o RENAVAM são normalizados antes da persistência.
      operationId: createClientMotorCycle
      security:
        - bearerAuth: []

      parameters:
        - name: clientId
          in: path
          required: true
          description: ID do cliente ao qual a motocicleta será vinculada.
          schema:
            type: integer
            example: 15

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - brand
                - model
                - plate
              properties:
                brand:
                  type: string
                  maxLength: 100
                  example: Honda

                model:
                  type: string
                  maxLength: 100
                  example: CG 160 Titan

                plate:
                  type: string
                  maxLength: 10
                  example: ABC-1D23

                renavam:
                  type: string
                  nullable: true
                  maxLength: 11
                  example: "12345678901"

                chassis:
                  type: string
                  nullable: true
                  maxLength: 17
                  example: 9C2KC0810FR123456

                year:
                  type: integer
                  nullable: true
                  minimum: 1900
                  example: 2024

                color:
                  type: string
                  nullable: true
                  maxLength: 50
                  example: Preto

                engine_number:
                  type: string
                  nullable: true
                  maxLength: 50
                  example: KC08E1F123456

            example:
              brand: Honda
              model: CG 160 Titan
              plate: ABC-1D23
              renavam: "12345678901"
              chassis: 9C2KC0810FR123456
              year: 2024
              color: Preto
              engine_number: KC08E1F123456

      responses:
        '201':
          description: Motocicleta cadastrada com sucesso.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: MOTORCYCLE.CREATE.DONE
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                        example: 42

        '401':
          description: Usuário não autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: USER.UNAUTHENTICATED
                data: null

        '404':
          description: Cliente não encontrado ou não pertence ao usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: CLIENT.NOT.FOUND
                data: null

        '422':
          description: Dados da motocicleta inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

components:
  securitySchemes:

    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: >
        Token de acesso Laravel Sanctum.
        Informe o token no formato "Bearer {token}".