
openapi: 3.1.0

info:
  title: MotoFlow API
  version: 1.0.0
  description: |
    API REST do MotoFlow, sistema de gerenciamento de oficinas de motocicletas.

    Todas as respostas seguem o envelope:
      {
        "message": "MESSAGE.FLAG",
        "data": {}
      }

    A autenticação utiliza Laravel Sanctum com Bearer Token.

servers:
  - url: http://localhost:8080/api
    description: Ambiente local

tags:
  - name: Health
    description: Verificação da disponibilidade da API
  - name: Authentication
    description: Autenticação e gerenciamento de sessões
  - name: Clients
    description: Gerenciamento de clientes
  - name: Motorcycles
    description: Gerenciamento de motocicletas
  - name: Repair Orders
    description: Gerenciamento de ordens de serviço

security:
  - BearerAuth: []

paths:

  # ==================================================
  # HEALTH
  # ==================================================

  /health:
    get:
      tags:
        - Health
      summary: Verificar disponibilidade da API
      security: []
      responses:
        '200':
          description: API disponível
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

  # ==================================================
  # AUTHENTICATION
  # ==================================================

  /login:
    post:
      tags:
        - Authentication
      summary: Realizar login
      description: |
        Valida as credenciais do usuário e inicia o processo de
        autenticação em duas etapas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login realizado e código de verificação gerado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginSuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /login/verify:
    post:
      tags:
        - Authentication
      summary: Verificar código de autenticação
      description: |
        Verifica o código de segundo fator enviado ao usuário
        e retorna o token de acesso.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginVerifyRequest'
      responses:
        '200':
          description: Código verificado e token gerado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginVerifySuccessResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /logout:
    post:
      tags:
        - Authentication
      summary: Encerrar sessão atual
      description: Encerra a sessão/token de autenticação atual.
      responses:
        '200':
          description: Sessão encerrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /logout-all:
    post:
      tags:
        - Authentication
      summary: Encerrar todas as sessões
      description: Revoga todos os tokens de autenticação do usuário.
      responses:
        '200':
          description: Todas as sessões foram encerradas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==================================================
  # CLIENTS
  # ==================================================

  /client:
    post:
      tags:
        - Clients
      summary: Cadastrar cliente
      description: |
        Cadastra um cliente. A imagem de perfil é enviada
        utilizando multipart/form-data.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreateClientRequest'
      responses:
        '201':
          description: Cliente cadastrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

    get:
      tags:
        - Clients
      summary: Listar clientes
      description: Retorna os clientes cadastrados pelo usuário com paginação.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Clientes encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /client/{clientId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'

    get:
      tags:
        - Clients
      summary: Buscar cliente por ID
      responses:
        '200':
          description: Cliente encontrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Clients
      summary: Atualizar cliente
      description: |
        Atualiza os dados do cliente. Somente os campos enviados
        serão atualizados. A imagem utiliza multipart/form-data.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UpdateClientRequest'
      responses:
        '200':
          description: Cliente atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags:
        - Clients
      summary: Excluir cliente
      responses:
        '200':
          description: Cliente excluído.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================================================
  # MOTORCYCLES
  # ==================================================

  /motorcycle/{clientId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'

    post:
      tags:
        - Motorcycles
      summary: Cadastrar motocicleta
      description: Cadastra uma motocicleta vinculada ao cliente informado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMotorcycleRequest'
      responses:
        '201':
          description: Motocicleta cadastrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /motorcycle/{clientId}/all:
    parameters:
      - $ref: '#/components/parameters/ClientId'

    get:
      tags:
        - Motorcycles
      summary: Listar motocicletas do cliente
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Motocicletas encontradas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotorcycleListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /motorcycle/{clientId}/{motorcycleId}:
    parameters:
      - $ref: '#/components/parameters/ClientId'
      - $ref: '#/components/parameters/MotorcycleId'

    get:
      tags:
        - Motorcycles
      summary: Buscar motocicleta por ID
      description: Busca uma motocicleta pertencente ao cliente informado.
      responses:
        '200':
          description: Motocicleta encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotorcycleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Motorcycles
      summary: Atualizar motocicleta
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMotorcycleRequest'
      responses:
        '200':
          description: Motocicleta atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

    delete:
      tags:
        - Motorcycles
      summary: Excluir motocicleta
      responses:
        '200':
          description: Motocicleta excluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  # ==================================================
  # REPAIR ORDERS
  # ==================================================

  /repair-order/list-actives:
    get:
      tags:
        - Repair Orders
      summary: Listar ordens de serviço ativas
      description: |
        Retorna as ordens de serviço que não possuem status
        DONE (5) ou CANCELED (6).
      responses:
        '200':
          description: Ordens ativas encontradas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActiveRepairOrderListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /repair-order/{motorcycleId}:
    parameters:
      - $ref: '#/components/parameters/MotorcycleId'

    post:
      tags:
        - Repair Orders
      summary: Criar ordem de serviço
      description: Cria uma ordem de serviço vinculada à motocicleta.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairOrderRequest'
      responses:
        '201':
          description: Ordem de serviço criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /repair-order/{motorcycleId}/{repairOrderId}:
    parameters:
      - $ref: '#/components/parameters/MotorcycleId'
      - $ref: '#/components/parameters/RepairOrderId'

    post:
      tags:
        - Repair Orders
      summary: Atualizar ordem de serviço
      description: |
        Atualiza a ordem de serviço utilizando o mesmo conjunto
        de regras de validação da criação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RepairOrderRequest'
      responses:
        '200':
          description: Ordem de serviço atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /repair-order/{repairOrderId}:
    parameters:
      - $ref: '#/components/parameters/RepairOrderId'

    get:
      tags:
        - Repair Orders
      summary: Buscar ordem de serviço
      description: |
        Retorna os dados completos da ordem de serviço,
        incluindo cliente, motocicleta, peças e serviços.
      responses:
        '200':
          description: Ordem de serviço encontrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RepairOrderResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Repair Orders
      summary: Excluir ordem de serviço
      responses:
        '200':
          description: Ordem de serviço excluída.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /repair-order/{repairOrderId}/sent-to-client:
    parameters:
      - $ref: '#/components/parameters/RepairOrderId'

    get:
      tags:
        - Repair Orders
      summary: Enviar ordem de serviço ao cliente
      description: |
        Dispara o processo de envio da ordem de serviço ao cliente.
        A operação retorna HTTP 202 (Accepted).
      responses:
        '202':
          description: Solicitação de envio aceita.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

# ==================================================
# COMPONENTS
# ==================================================

components:

  # --------------------------------------------------
  # SECURITY
  # --------------------------------------------------

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
      description: Token de acesso gerado após a verificação do segundo fator.

  # --------------------------------------------------
  # PARAMETERS
  # --------------------------------------------------

  parameters:

    ClientId:
      name: clientId
      in: path
      required: true
      description: Identificador do cliente.
      schema:
        type: integer
        minimum: 1
      example: 2

    MotorcycleId:
      name: motorcycleId
      in: path
      required: true
      description: Identificador da motocicleta.
      schema:
        type: integer
        minimum: 1
      example: 2

    RepairOrderId:
      name: repairOrderId
      in: path
      required: true
      description: Identificador da ordem de serviço.
      schema:
        type: integer
        minimum: 1
      example: 10

    Page:
      name: page
      in: query
      required: false
      description: Número da página.
      schema:
        type: integer
        minimum: 1
        default: 1
      example: 1

    PerPage:
      name: per_page
      in: query
      required: false
      description: Quantidade de registros por página.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
      example: 15

  # --------------------------------------------------
  # RESPONSES
  # --------------------------------------------------

  responses:

    Unauthorized:
      description: Usuário não autenticado ou token inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: USER.UNAUTHENTICATED
            data: null

    NotFound:
      description: Registro não encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: CLIENT.NOT_FOUND
            data: null

    ValidationError:
      description: Erro de validação dos campos enviados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: FORM.CLIENT.NAME.REQUIRED
            data: null

  # --------------------------------------------------
  # SCHEMAS
  # --------------------------------------------------

  schemas:

    # ================================================
    # COMMON
    # ================================================

    ApiResponse:
      type: object
      description: Envelope padrão de resposta da API.
      properties:
        message:
          type: string
          example: OPERATION.SUCCESS
        data: {}
      required:
        - message
        - data

    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: USER.UNAUTHENTICATED
        data: {}
      required:
        - message
        - data

    Pagination:
      type: object
      properties:
        current_page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 15
        total:
          type: integer
          example: 2
        last_page:
          type: integer
          example: 1
        from:
          type: [integer, "null"]
          example: 1
        to:
          type: [integer, "null"]
          example: 2
      required:
        - current_page
        - per_page
        - total
        - last_page
        - from
        - to

    # ================================================
    # AUTHENTICATION
    # ================================================

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: contato@example.com
        password:
          type: string
          format: password
          example: "Password123!"
      required:
        - email
        - password

    LoginVerifyRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          example: contato@example.com
        code:
          type: string
          minLength: 6
          maxLength: 6
          description: Código de verificação com exatamente 6 caracteres.
          example: "123456"
      required:
        - email
        - code

    LoginSuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: USER.LOGIN.SUCCESS
        data:
          type: object
          properties:
            two_factor_code_generated:
              type: boolean
              example: true
          required:
            - two_factor_code_generated
      required:
        - message
        - data

    LoginVerifySuccessResponse:
      type: object
      properties:
        message:
          type: string
          example: USER.CODE.VERIFIED
        data:
          type: object
          properties:
            token:
              type: string
              description: Token de autenticação.
              example: "2|{access_token}"
            token_type:
              type: string
              example: Bearer
          required:
            - token
            - token_type
      required:
        - message
        - data

    # ================================================
    # CLIENTS
    # ================================================

    CreateClientRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: Jonas Moriá
        phone:
          type: string
          description: Telefone celular brasileiro.
          example: "5512996717939"
        email:
          type: [string, "null"]
          format: email
          maxLength: 255
          example: contato@example.com
        document:
          type: [string, "null"]
          maxLength: 20
          example: "51899251880"
        address:
          type: [string, "null"]
          example: Rua Presidente Bernardes, 151
        avatar:
          type: string
          format: binary
          description: |
            Imagem de perfil. Formatos permitidos: jpg, jpeg, png e webp.
            Tamanho máximo: 5120 KB.
      required:
        - name
        - phone

    UpdateClientRequest:
      type: object
      description: Todos os campos são opcionais. Campos nullable aceitam null.
      properties:
        name:
          type: string
          maxLength: 255
          example: Jonas Moriá
        phone:
          type: string
          description: Telefone celular brasileiro.
          example: "5512996717939"
        email:
          type: [string, "null"]
          format: email
          maxLength: 255
          example: contato@example.com
        document:
          type: [string, "null"]
          maxLength: 20
          example: "51899251880"
        address:
          type: [string, "null"]
          example: Rua Presidente Bernardes, 151
        avatar:
          type: string
          format: binary
          description: |
            Imagem de perfil. Formatos permitidos: jpg, jpeg, png e webp.
            Tamanho máximo: 5120 KB.

    Client:
      type: object
      properties:
        id:
          type: integer
          example: 2
        name:
          type: string
          example: Jonas Moriá
        phone:
          type: string
          example: "5512996717939"
        email:
          type: [string, "null"]
          format: email
          example: contato@example.com
        document:
          type: [string, "null"]
          example: "51899251880"
        address:
          type: [string, "null"]
          example: null
        avatar_path:
          type: [string, "null"]
          example: null
        created_at:
          type: string
          format: date-time
          example: "2026-11-02T19:50:52.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-11-02T19:50:52.000000Z"
      required:
        - id
        - name
        - phone
        - email
        - document
        - address
        - avatar_path
        - created_at
        - updated_at

    ClientResponse:
      type: object
      properties:
        message:
          type: string
          example: CLIENT.FIND.SUCCESS
        data:
          $ref: '#/components/schemas/Client'
      required:
        - message
        - data

    ClientListData:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Client'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required:
        - data
        - pagination

    ClientListResponse:
      type: object
      properties:
        message:
          type: string
          example: CLIENT.FIND_ALL.SUCCESS
        data:
          $ref: '#/components/schemas/ClientListData'
      required:
        - message
        - data

    # ================================================
    # MOTORCYCLES
    # ================================================

    CreateMotorcycleRequest:
      type: object
      properties:
        brand:
          type: string
          maxLength: 100
          example: Yamaha
        model:
          type: string
          maxLength: 100
          example: Fazer 250
        plate:
          type: string
          maxLength: 10
          example: DQW0255
        renavam:
          type: [string, "null"]
          maxLength: 11
          example: "10887924546"
        chassis:
          type: [string, "null"]
          maxLength: 17
          example: "1T2UPS9EFVWEX2419"
        year:
          type: [integer, "null"]
          minimum: 1900
          example: 2025
        color:
          type: [string, "null"]
          maxLength: 50
          example: Preta
        engine_number:
          type: [string, "null"]
          maxLength: 50
          example: "ENG123456"
      required:
        - brand
        - model
        - plate

    UpdateMotorcycleRequest:
      type: object
      description: Todos os campos são opcionais. Campos nullable aceitam null.
      properties:
        brand:
          type: string
          maxLength: 100
          example: Yamaha
        model:
          type: string
          maxLength: 100
          example: Fazer 250
        plate:
          type: string
          maxLength: 10
          example: DQW0255
        renavam:
          type: [string, "null"]
          maxLength: 11
          example: "10887924546"
        chassis:
          type: [string, "null"]
          maxLength: 17
          example: "1T2UPS9EFVWEX2419"
        year:
          type: [integer, "null"]
          minimum: 1900
          example: 2025
        color:
          type: [string, "null"]
          maxLength: 50
          example: Preta
        engine_number:
          type: [string, "null"]
          maxLength: 50
          example: "ENG123456"

    Motorcycle:
      type: object
      properties:
        id:
          type: integer
          example: 2
        brand:
          type: string
          example: Yamaha
        model:
          type: string
          example: Fazer 250
        plate:
          type: string
          example: DQW0255
        renavam:
          type: [string, "null"]
          example: "10887924546"
        chassis:
          type: [string, "null"]
          example: "1T2UPS9EFVWEX2419"
        year:
          type: [integer, "null"]
          example: 2025
        color:
          type: [string, "null"]
          example: Preta
        engine_number:
          type: [string, "null"]
          example: null
        created_at:
          type: string
          format: date-time
          example: "2026-11-02T19:55:13.000000Z"
        updated_at:
          type: string
          format: date-time
          example: "2026-11-02T19:55:13.000000Z"
      required:
        - id
        - brand
        - model
        - plate
        - renavam
        - chassis
        - year
        - color
        - engine_number
        - created_at
        - updated_at

    MotorcycleResponse:
      type: object
      properties:
        message:
          type: string
