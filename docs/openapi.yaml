openapi: 3.0.3

info:
  title: MotoFlow API
  description: API para gerenciamento de oficinas de motocicletas.
  version: 1.0.0

servers:
  - url: http://localhost:8080/api
    description: Ambiente local

tags:
  - name: Health
    description: Verificação de disponibilidade da API

  - name: Autenticação
    description: Endpoints relacionados à autenticação dos usuários

paths:

  /health:
    get:
      tags:
        - Health
      summary: Verifica a disponibilidade da API
      description: Retorna o estado atual da API.
      operationId: healthCheck

      responses:
        '200':
          description: API disponível


  /login:
    post:
      tags:
        - Autenticação
      summary: Realiza o login do usuário
      description: Inicia o processo de autenticação do usuário.
      operationId: login

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: E-mail utilizado para autenticação
                  example: usuario@motoflow.com

                password:
                  type: string
                  format: password
                  description: Senha do usuário
                  example: secret

      responses:
        '200':
          description: Login iniciado com sucesso

        '401':
          description: Credenciais inválidas

        '422':
          description: Dados de entrada inválidos


  /login/verify:
    post:
      tags:
        - Autenticação
      summary: Verifica o código de autenticação
      description: >
        Valida o código de autenticação de dois fatores enviado ao usuário
        após o login. Quando o código é válido, utilizado pela primeira vez
        e ainda está dentro do prazo de validade, a autenticação é concluída
        e um token de acesso Sanctum é gerado.
      operationId: verifyLogin

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - code
              properties:
                email:
                  type: string
                  format: email
                  description: E-mail utilizado na tentativa de login
                  example: usuario@motoflow.com

                code:
                  type: string
                  description: Código de autenticação de dois fatores recebido pelo usuário
                  example: "123456"

      responses:
        '200':
          description: Código validado e autenticação concluída
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: USER.LOGIN.SUCCESS

                  data:
                    type: object
                    properties:
                      token:
                        type: string
                        description: Token de acesso gerado pelo Laravel Sanctum
                        example: 1|abcdefghijklmnopqrstuvwxyz123456

                      token_type:
                        type: string
                        example: Bearer

        '401':
          description: Código inválido ou credenciais inválidas

        '422':
          description: Dados de entrada inválidos

        '403':
          description: Código expirado ou número máximo de tentativas excedido