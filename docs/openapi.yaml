    # ================================================
    # REPAIR ORDER ENUMS
    # ================================================

    RepairStatusCode:
      type: integer
      description: Status da ordem de serviço.
      enum:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
      x-enum-varnames:
        - CREATED
        - WAITING
        - IN_MAINTENANCE
        - WAITING_PICKUP
        - DONE
        - CANCELED
      x-enum-descriptions:
        - Created
        - Waiting
        - In Maintenance
        - Waiting Pickup
        - Done
        - Canceled
      example: 1

    UrgencyLevelCode:
      type: integer
      description: Nível de urgência da ordem de serviço.
      enum:
        - 1
        - 2
        - 3
        - 4
        - 5
      x-enum-varnames:
        - VERY_LOW
        - LOW
        - MEDIUM
        - HIGH
        - VERY_HIGH
      x-enum-descriptions:
        - Lowest
        - Low
        - Medium
        - High
        - Highest
      example: 3

    # ================================================
    # REPAIR ORDER REQUESTS
    # ================================================

    RepairOrderPartRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: Óleo 5W30 MOTUL
        description:
          type: [string, "null"]
          example: null
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
          example: 1.98
        unit_value:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 35.00
      required:
        - name
        - unit_value

    RepairOrderServiceRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
          example: Troca de óleo
        description:
          type: [string, "null"]
          example: null
        quantity:
          type: number
          exclusiveMinimum: 0
          multipleOf: 0.01
          example: 1.00
        unit_value:
          type: number
          minimum: 0
          multipleOf: 0.01
          example: 10.00
      required:
        - name
        - unit_value

    RepairOrderRequest:
      type: object
      description: |
        Dados para criação ou atualização de ordem de serviço.
        A atualização utiliza o mesmo FormRequest da criação,
        portanto title e description continuam obrigatórios.
      properties:
        title:
          type: string
          maxLength: 255
          example: Revisão completa
        description:
          type: string
          example: Revisão premium
        status:
          $ref: '#/components/schemas/RepairStatusCode'
        urgency_level:
          $ref: '#/components/schemas/UrgencyLevelCode'
        diagnosis:
          type: [string, "null"]
          example: Revisão de fluidos, pneus e rolamentos
        observations:
          type: [string, "null"]
          example: Verificar partida a frio
        parts:
          type: array
          items:
            $ref: '#/components/schemas/RepairOrderPartRequest'
        services:
          type: array
          items:
            $ref: '#/components/schemas/RepairOrderServiceRequest'
      required:
        - title
        - description

